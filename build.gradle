/**
 * The following tasks create JARs for alternative main classes used for computation on HPC Clusters.
 */
task varyAutoPolyJar(type: Jar) {
    archiveBaseName = 'autoPolyCmd'
    
    // Set your target Main Class
    manifest {
        attributes 'Main-Class': 'billiards.viewer.VaryAutoPolyCmd'
    }
    
    // Mix in your compiled project classes
    from sourceSets.main.output
    
    // Pull and unpack dependency classes, bypassing signed jar errors
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    } {
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
    }
    
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

