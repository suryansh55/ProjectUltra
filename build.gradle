apply plugin: 'application'
apply plugin: 'cpp'
apply plugin: TestingModelBasePlugin
//apply plugin: 'findbugs'

// At top level of build.gradle
def currentOs = org.gradle.internal.os.OperatingSystem.current()
def currentArch = System.getProperty("os.arch")
def isWindows = currentOs.isWindows()
def isLinux = currentOs.isLinux()
def isMac = currentOs.isMacOsX()
def platform  = isWindows ? "win" : (isMac ? (currentArch.contains("aarch64") || currentArch.contains("arm64") ? "mac-aarch64" : "mac-x64") : "linux")
ext.requestedTasks = gradle.startParameter.taskNames;
ext.isBuild = requestedTasks.any { it == 'build' || it.endsWith(':build') }

/*
    2025/08/15 Marco Mai
    Detect where is Java for windows
 */
// detect where is mingw64
if (isWindows){
    try {
        // Ask PowerShell for g++ locations
        def cmd = [
                'powershell', '-NoProfile', '-Command',
                'Get-Command g++ -All | Select-Object -ExpandProperty Source'
        ]
        def proc = new ProcessBuilder(cmd).redirectErrorStream(true).start()
        proc.waitFor()
        def out = proc.inputStream.getText('UTF-8')
        def lines = out.readLines().findAll { it?.trim() }

        // Look specifically for mingw64\bin
        def preferred = lines.find { it.toLowerCase().contains('\\mingw64\\bin\\g++.exe') }
        if (!preferred)  {
            throw new GradleException("mingw64 g++ not found in PATH. Install MSYS2 mingw64 and ensure it's first in PATH.")
        }

        ext.MINGW64_BIN = new File(preferred).parent
        println "Using mingw64 g++ at: ${ext.MINGW64_BIN}"
    } catch (Exception e) {
        throw new GradleException("Error detecting mingw64 g++: ${e.message}")
    }
}

mainClassName = 'billiards.viewer.Main'

repositories {
    mavenCentral()
}

dependencies {
    // When getting the version number for a dependency, don't go to Maven Central and
    // simply search for the package you want. You will often find many versions of the
    // package, most of which are unofficial or out-of-date. Instead, go to the website
    // of the package, and they will usually give you the correct Maven information there.
    implementation 'org.eclipse.collections:eclipse-collections-api:9.2.0'  // All the interfaces
    implementation 'org.eclipse.collections:eclipse-collections:9.2.0'  // The actual classes
    implementation 'com.google.guava:guava:25.1-jre'
    implementation 'org.apache.commons:commons-math3:3.6.1'
    implementation 'org.apache.commons:commons-lang3:3.7'  // can remove this now I think?
    implementation 'org.apache.commons:commons-io:1.3.2'
    implementation 'io.javaslang:javaslang:2.0.5'
    implementation 'org.xerial:sqlite-jdbc:3.41.2.2'
    implementation 'net.java.dev.jna:jna:5.13.0'
    implementation 'org.fxmisc.richtext:richtextfx:0.10.4'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.2.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.2.0'
}

test {
    useJUnitPlatform()
}

compileJava {
    //options.compilerArgs << '-Xlint' << '-Werror'
    options.compilerArgs << '-Xlint'
}

if (isLinux) {
    tasks.register('copyNativeLibs', Copy) {
        from("/usr/lib/x86_64-linux-gnu") {
            include "libmpfr.so*","libmpfi.so*","libgmp.so*","libsqlite3.so*","libtbb.so*","libtbbmalloc.so*"
            include "libboost_thread.so*","libboost_system.so*"
            exclude "libstdc++.so*","libgcc_s.so*","libc.so*","libm.so*"
        }
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
        into "$buildDir/libs/backend/shared"
    }
    build.dependsOn 'copyNativeLibs'
}

def scriptByPlatform = [
    "mac-aarch64": "src/jarRunScript/MacRun.sh",
    "mac-x64"    : "src/jarRunScript/MacRun.sh",
    "linux"      : "src/jarRunScript/LinuxRun.sh",
]
def srcFile = layout.projectDirectory.file(scriptByPlatform[platform])
def dstFile = layout.buildDirectory.file("libs/run.sh")


tasks.register("copyRunScript") {

    inputs.file(srcFile)
    outputs.file(dstFile)

    // Only run on Unix-like OS (Linux/macOS)
    onlyIf {
        org.gradle.internal.os.OperatingSystem.current().isUnix()
    }

    doLast {
        def src = srcFile.asFile
        def dst = dstFile.get().asFile
        dst.parentFile.mkdirs()

        // Use OS cp
        project.exec {
            commandLine "cp", src.absolutePath, dst.absolutePath
        }

        // Make it executable
        dst.setExecutable(true)
    }
}
tasks.named("build") { finalizedBy("copyRunScript") }


jar {
    archivesBaseName = 'billiard-viewer'
    if (System.getProperty('os.name').toLowerCase().contains('linux')) {
        dependsOn "backendSharedLibrary"

    }
    duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
        configurations.compileClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
exclude 'META-INF/*.RSA', 'META-INF/*.SF','META-INF/*.DSA'
    manifest.attributes 'Main-Class': 'billiards.viewer.Main'
}

sourceSets {
    main {
        java {
            srcDir 'src/java'
        }

        //resources {
            //srcDir 'css'
        //}
    }
}

applicationDefaultJvmArgs = ['-server', '-Djna.library.path=backend/shared/', "-Djava.library.path=backend/shared", '-Xss1000m']

sourceCompatibility = 1.8
targetCompatibility = 1.8


model {
    // Zhao Yu Li, Aug 15, 2025.
    // These configurations are specific to MingW64 on Windows. Change the path to point to your MingW64 installation
    toolChains {
        if (isWindows) {
            mingw(Gcc) {
                path  project.ext.MINGW64_BIN
                //path  "C:/msys64/mingw64/bin" // fall back to specific options
                target("x86_64-w64-mingw32")
            }
        }
    }
    platforms {
        if (isWindows) {
            x86_64 {
                architecture "x86_64"
                operatingSystem "windows"
            }
        }
    }

    components {

        backend(NativeLibrarySpec) {
            if (isWindows) targetPlatform "x86_64"

            sources.cpp {

                exportedHeaders{
                    srcDir "src/backend/headers"
                    srcDir "src/test/cpp"
                    srcDir "Eigen"
                    srcDir "boost"
                }
            }

            binaries.all {

                cppCompiler.define "NDEBUG"
                cppCompiler.args '-O3', '-march=native', '-flto', '-ftrapv'
                // Aug,8 2025 Marco,Mai
                // for Aplle Arm platnorm there is an instruction to use java17 natively
                if (platform == "mac-aarch64" ) {
                    cppCompiler.args '-I/opt/homebrew/include'
                    linker.args '-L/opt/homebrew/lib', '-L/opt/homebrew/opt/', '-lgmp', '-lmpfr', '-lmpfi', '-lsqlite3', '-ltbb', '-lboost_thread', '-lboost_system'
                } else if (platform == "mac-x64" ) {
                    linker.args  '-lgmp', '-lmpfr', '-lmpfi', '-lsqlite3', '-ltbb', '-lboost_thread-mt', '-lboost_system-mt'
                } else if (isLinux){
                    if (ext.isBuild) {
                     linker.args '-Wl,-z,origin','-Wl,-rpath,$ORIGIN','-Wl,-rpath,$ORIGIN/backend/shared'
                    }
                    linker.args '-lgmp', '-lmpfr', '-lmpfi', '-lsqlite3', '-ltbb','-lboost_thread', '-lboost_system'
                } else if (isWindows) {
                    linker.args '-lgmp', '-lmpfr', '-lmpfi', '-lsqlite3', '-ltbb12','-lboost_thread-mt', '-lws2_32', '-Wl,--allow-multiple-definition','-lboost_system-mgw15-mt-x64-1_88'
                } else {
                    linker.args '-lgmp', '-lmpfr', '-lmpfi', '-lsqlite3', '-ltbb','-lboost_thread', '-lboost_system'
                }
                
                if (toolChain in Clang) {
                    cppCompiler.args '-Werror',
                                     '-Wno-padded', '-Wno-comma',
                                     '-Wno-exit-time-destructors', '-Wno-global-constructors',
                                     '-Wno-c++98-compat', '-Wno-c++98-compat-pedantic',
                                     '-std=c++14'
                }

                if (toolChain in Gcc) {
                    cppCompiler.args '-Wextra', '-Wpedantic', '-Werror',"-fPIC",
                                     '-Wno-c++11-compat', '-Wno-c++14-compat',
                                     '-std=c++14'
                }

                checkedBy $.tasks.testBackend
            }
        }

        test(NativeExecutableSpec) {
            if (isWindows) targetPlatform "x86_64"

            sources.cpp {
                lib library: 'backend', linkage: 'static'
            }

            binaries.all {

                cppCompiler.define "NDEBUG"
                cppCompiler.args '-O3', '-march=native', '-flto', '-ftrapv'
                // Aug,8 2025 Marco,Mai
                // for Aplle Arm platnorm there is an instruction to use java17 natively
                if (platform == "mac-aarch64" ) {
                    cppCompiler.args '-I/opt/homebrew/include'
                    linker.args '-L/opt/homebrew/lib', '-L/opt/homebrew/opt/', '-lgmp', '-lmpfr', '-lmpfi', '-lsqlite3', '-ltbb', '-lboost_thread', '-lboost_system','-lboost_unit_test_framework'
                } else if (platform == "mac-x64" ) {
                    linker.args  '-lgmp', '-lmpfr', '-lmpfi', '-lsqlite3', '-ltbb', '-lboost_thread-mt', '-lboost_system-mt','-lboost_unit_test_framework'
                } else if (isWindows) {
                    linker.args '-lboost_unit_test_framework-mt', '-lgmp', '-lmpfr', '-lmpfi', '-lsqlite3', '-ltbb12','-lboost_thread-mt', '-lws2_32', '-Wl,--allow-multiple-definition','-lboost_system-mgw15-mt-x64-1_88'
                } else {
                    linker.args '-lgmp', '-lmpfr', '-lmpfi', '-lsqlite3', '-ltbb','-lboost_thread','-lboost_system', '-lboost_unit_test_framework','-pthread'
                }

                if (toolChain in Clang) {
                    cppCompiler.args  '-Werror',
                                     '-Wno-padded', '-Wno-comma',
                                     '-Wno-disabled-macro-expansion', '-Wno-global-constructors',
                                     '-Wno-c++98-compat', '-Wno-c++98-compat-pedantic',
                                     '-std=c++14'
                }

                if (toolChain in Gcc) {
                    cppCompiler.args '-Wall', '-Wextra', '-Wpedantic', '-Werror',
                                     '-Wno-c++11-compat', '-Wno-c++14-compat',
                                     '-std=c++14'
                }
            }
        }
    }
}

