model {
    // Zhao Yu Li, Aug 15, 2025.
    // These configurations are specific to MingW64 on Windows. Change the path to point to your MingW64 installation
    toolChains {
        if (isWindows) {
            mingw(Gcc) {
                path  project.ext.TOOLCHAINS_BIN
                //path  "C:/msys64/mingw64/bin" // fall back to specific options
                target("x86_64-w64-mingw32")
            }
        }
    }
    platforms {
        if (isWindows) {
            x86_64 {
                architecture "x86_64"
                operatingSystem "windows"
            }
        }
    }

    components {

        backend(NativeLibrarySpec) {
            if (isWindows) targetPlatform "x86_64"

            sources.cpp {

                exportedHeaders{
                    srcDir "src/backend/headers"
                    srcDir "src/test/cpp"
                    srcDir "Eigen"
                    srcDir "boost"
                }
            }

            binaries.all {

                cppCompiler.define "NDEBUG"
                cppCompiler.args '-O3', '-march=native', '-flto', '-ftrapv'
                // Aug,8 2025 Marco,Mai
                // for Aplle Arm platnorm there is an instruction to use java17 natively
                if (platform == "mac-aarch64" ) {
                    cppCompiler.args '-I/opt/homebrew/include'
                    //linker.args '-L/opt/homebrew/lib', '-L/opt/homebrew/opt/', '-lgmp', '-lmpfr', '-lmpfi', '-lsqlite3', '-ltbb', '-lboost_thread', '-lboost_system'
                      linker.args '-L/opt/homebrew/lib', '-L/opt/homebrew/opt/', '-lgmp', '-lmpfr', '-lmpfi', '-lsqlite3', '-ltbb', '-lboost_thread'// removed '-lboost_system' george dec18,2025
                
                } else if (platform == "mac-x64" ) {
                    //linker.args  '-lgmp', '-lmpfr', '-lmpfi', '-lsqlite3', '-ltbb', '-lboost_thread-mt', '-lboost_system-mt'
                      linker.args  '-lgmp', '-lmpfr', '-lmpfi', '-lsqlite3', '-ltbb', '-lboost_thread'//george dec18,225 removed '-lboost_thread-mt', '-lboost_system-mt',  '-lboost_system'/
                
                } else if (isLinux){
                    if (ext.isBuild) {
                     linker.args '-Wl,-z,origin','-Wl,-rpath,$ORIGIN','-Wl,-rpath,$ORIGIN/backend/shared'
                    }
                    linker.args '-lgmp', '-lmpfr', '-lmpfi', '-lsqlite3', '-ltbb','-lboost_thread', '-lboost_system'
                } else if (isWindows) {
                    linker.args '-lgmp', '-lmpfr', '-lmpfi', '-lsqlite3', '-ltbb12','-lboost_thread-mt', '-lws2_32', '-Wl,--allow-multiple-definition'  // ,'-lboost_system-mgw15-mt-x64-1_88'
                } else {
                    linker.args '-lgmp', '-lmpfr', '-lmpfi', '-lsqlite3', '-ltbb','-lboost_thread', '-lboost_system'
                }
                
                if (toolChain in Clang) {
                    cppCompiler.args '-Werror',
                                     '-Wno-padded', '-Wno-comma',
                                     '-Wno-exit-time-destructors', '-Wno-global-constructors',
                                     '-Wno-c++98-compat', '-Wno-c++98-compat-pedantic',
                                     '-std=c++14'
                }

                if (toolChain in Gcc) {
                    cppCompiler.args '-Wextra', '-Wpedantic', '-Werror',"-fPIC",
                                     '-Wno-c++11-compat', '-Wno-c++14-compat',
                                     '-std=c++14'
                }

                checkedBy $.tasks.testBackend
            }
        }

        test(NativeExecutableSpec) {
            if (isWindows) targetPlatform "x86_64"

            sources.cpp {
                lib library: 'backend', linkage: 'static'
            }

            binaries.all {

                cppCompiler.define "NDEBUG"
                cppCompiler.args '-O3', '-march=native', '-flto', '-ftrapv'
                // Aug,8 2025 Marco,Mai
                // for Aplle Arm platnorm there is an instruction to use java17 natively
                if (platform == "mac-aarch64" ) {
                    cppCompiler.args '-I/opt/homebrew/include'
                    linker.args '-L/opt/homebrew/lib', '-L/opt/homebrew/opt/', '-lgmp', '-lmpfr', '-lmpfi', '-lsqlite3', '-ltbb', '-lboost_thread', '-lboost_system','-lboost_unit_test_framework'
                } else if (platform == "mac-x64" ) {
                    linker.args  '-lgmp', '-lmpfr', '-lmpfi', '-lsqlite3', '-ltbb', '-lboost_thread-mt', '-lboost_system-mt','-lboost_unit_test_framework'
                } else if (isWindows) {
                    linker.args '-lboost_unit_test_framework-mt', '-lgmp', '-lmpfr', '-lmpfi', '-lsqlite3', '-ltbb12','-lboost_thread-mt', '-lws2_32', '-Wl,--allow-multiple-definition','-lboost_system-mgw15-mt-x64-1_88'
                } else {
                    linker.args '-lgmp', '-lmpfr', '-lmpfi', '-lsqlite3', '-ltbb','-lboost_thread','-lboost_system', '-lboost_unit_test_framework','-pthread'
                }

                if (toolChain in Clang) {
                    cppCompiler.args  '-Werror',
                                     '-Wno-padded', '-Wno-comma',
                                     '-Wno-disabled-macro-expansion', '-Wno-global-constructors',
                                     '-Wno-c++98-compat', '-Wno-c++98-compat-pedantic',
                                     '-std=c++14'
                }

                if (toolChain in Gcc) {
                    cppCompiler.args '-Wall', '-Wextra', '-Wpedantic', '-Werror',
                                     '-Wno-c++11-compat', '-Wno-c++14-compat',
                                     '-std=c++14'
                }
            }
        }
    }
}

