// At top level of build.gradle
def currentOs = org.gradle.internal.os.OperatingSystem.current()
def currentArch = System.getProperty("os.arch")
def isWindows = currentOs.isWindows()
def isLinux = currentOs.isLinux()
def isMac = currentOs.isMacOsX()
def platform  = isWindows ? "win" : (isMac ? (currentArch.contains("aarch64") || currentArch.contains("arm64") ? "mac-aarch64" : "mac-x64") : "linux")
ext.requestedTasks = gradle.startParameter.taskNames;
ext.isBuild = requestedTasks.any { it == 'build' || it.endsWith(':build') }

/*
    2025/08/15 Marco Mai
    Detect where is Java for windows
 */
// detect where is mingw64
if (isWindows){
    try {
        // Ask PowerShell for g++ locations
        def cmd = [
                'powershell', '-NoProfile', '-Command',
                'Get-Command g++ -All | Select-Object -ExpandProperty Source'
        ]
        def proc = new ProcessBuilder(cmd).redirectErrorStream(true).start()
        proc.waitFor()
        def out = proc.inputStream.getText('UTF-8')
        def lines = out.readLines().findAll { it?.trim() }

        // Look for ucrt64\bin and mingw64\bin
        def ucrt64 = lines.find { it.toLowerCase().contains('\\ucrt64\\bin\\g++.exe') }
        def mingw64 = lines.find { it.toLowerCase().contains('\\mingw64\\bin\\g++.exe') }

        if (!ucrt64 && !mingw64)  {
            throw new GradleException("mingw64 and urt64 g++ not found in PATH. Install either MSYS2 mingw64 or ucrt64 and ensure it's in PATH.")
        }

        if (ucrt64) {
            ext.TOOLCHAINS_BIN = new File(ucrt64).parent
            println "Using ucrt64 g++ at: ${ext.TOOLCHAINS_BIN}"
        } else if (mingw64) {
            ext.TOOLCHAINS_BIN = new File(mingw64).parent
            println "Using mingw64 g++ at: ${ext.TOOLCHAINS_BIN}"
        }
    } catch (Exception e) {
        throw new GradleException("Error detecting g++: ${e.message}")
    }
}

