if (isLinux) {
    // make sure you have the following lib
    // sudo apt install -y libsqlite3-dev libgmp-dev libmpfr-dev 
    // libmpfi-dev libboost-all-dev libeigen3-dev libtbb-dev
    //  libjemalloc-dev libcanberra-gtk-module libcanberra-gtk3-module
    tasks.register('copyNativeLibs', Copy) {
        from("/usr/lib/x86_64-linux-gnu") {
            include "libmpfr.so*","libmpfi.so*","libgmp.so*","libsqlite3.so*","libtbb.so*","libtbbmalloc.so*"
            include "libboost_thread.so*","libboost_system.so*","libjemalloc.so*","libcanberra.so*"
            exclude "libstdc++.so*","libgcc_s.so*","libc.so*","libm.so*"
        }
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
        into "$buildDir/libs/backend/shared"
    }

    // "Linux-only: copy the JDK/JRE runtime into build/runtime (slimmed + chmod)."

    tasks.register("copyRuntimeLinux", Copy) {

        def home = new File(System.getenv("JAVA_HOME") ?: System.getProperty("java.home"))
        def runtimeDir = new File(home, "jre").exists() ? new File(home, "jre") : home

        from(runtimeDir) {
            exclude "demo/**", "sample/**", "man/**", "include/**", "src.zip", "**/*.pdb"
        }
        into("$buildDir/libs/runtime")

        doFirst {
            def vendor = (System.getProperty("java.vendor") ?: "").toLowerCase()
            if (vendor.contains("oracle")) {
                println "⚠️ Oracle JDK detected. Redistribution may require a commercial license."
            }
        }
        
        doLast {
            def binDir = file("$buildDir/libs/runtime/bin")
            if (binDir.exists()) {
                ant.chmod(perm: "a+rx", dir: binDir, includes: "*")
            }
        }
    }
    
    build.dependsOn 'copyNativeLibs',"copyRuntimeLinux"
}

def scriptByPlatform = [
    "mac-aarch64": "src/jarRunScript/Mac8Run.sh",
    "mac-x64"    : "src/jarRunScript/Mac8Run.sh",
    "linux"      : "src/jarRunScript/Linux8Run.sh",
]
def srcFile = layout.projectDirectory.file(scriptByPlatform[platform])
def dstFile = layout.buildDirectory.file("libs/run.sh")


tasks.register("copyRunScript") {

    inputs.file(srcFile)
    outputs.file(dstFile)

    // Only run on Unix-like OS (Linux/macOS)
    onlyIf {
        org.gradle.internal.os.OperatingSystem.current().isUnix()
    }

    doLast {
        def src = srcFile.asFile
        def dst = dstFile.get().asFile
        dst.parentFile.mkdirs()

        // Use OS cp
        project.exec {
            commandLine "cp", src.absolutePath, dst.absolutePath
        }

        // Make it executable
        dst.setExecutable(true)
    }
}
tasks.named("build") { finalizedBy("copyRunScript") }


